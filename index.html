<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIMSON SYNDICATE : PROLOGUE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Nanum Gothic for clean readability -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-color: #050505;
            color: #d1d5db;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 웹툰 컨테이너: 표준 웹툰 너비 및 중앙 정렬 */
        .webtoon-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #000000;
            box-shadow: 0 0 50px rgba(139, 0, 0, 0.2);
        }

        /* 컷과 컷 사이의 간격(공백)을 완전히 제거 */
        .webtoon-img {
            display: block;
            width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
            border: none;
            vertical-align: top;
        }

        /* 다크 느와르풍 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #080808;
        }
        ::-webkit-scrollbar-thumb {
            background: #8b0000;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff1a1a;
        }
    </style>
</head>
<body class="bg-[#050505] antialiased">

    <!-- 메인 웹툰 뷰어 영역 -->
    <main class="w-full min-h-screen bg-black">
        <div class="webtoon-container relative">
            
            <!-- 이미지 로드 실패 시 표시될 대체 안내문구 (시각적 가이드) -->
            <div id="loading-notice" class="hidden absolute top-0 left-0 w-full p-4 bg-red-950/80 text-red-200 text-xs text-center z-10">
                이미지 파일 경로(13.png ~ 23.png)를 확인해주세요.
            </div>

            <!-- 13부터 23까지의 웹툰 컷 이미지 순차 출력 (간격 없음) -->
            <div id="webtoon-cuts">
                <script>
                    // 스크린샷 예시(13~23)에 맞춘 파일명 시퀀스 정의
                    const startNum = 13;
                    const endNum = 23;
                    let cutsHTML = '';

                    for (let i = startNum; i <= endNum; i++) {
                        // 웹툰의 연속성을 위해 간격 없이 이미지 태그 생성
                        cutsHTML += `<img src="${i}.png" alt="Prologue Cut ${i}" class="webtoon-img" onerror="handleImageError(this, ${i})">`;
                    }
                    document.write(cutsHTML);

                    // 이미지가 존재하지 않을 경우 다크 느와르풍의 플레이스홀더 영역으로 자동 전환
                    function handleImageError(imgElement, index) {
                        imgElement.outerHTML = `
                            <div class="w-full bg-[#0a0a0a] border-y border-[#1a0505] py-32 px-4 text-center select-none">
                                <span class="text-xs uppercase tracking-widest text-red-800 font-bold block mb-2">[ SCENE ${index < 10 ? '0' + index : index} ]</span>
                                <p class="text-xs text-neutral-600">${index}.png 이미지 파일이 없습니다.</p>
                            </div>
                        `;
                    }
                </script>
            </div>

            <!-- 프롤로그 감상 종료선 (하단 여백) -->
            <div class="w-full bg-black py-20 text-center border-t border-neutral-900">
                <p class="text-xs uppercase tracking-[0.3em] text-neutral-600 font-semibold">Prologue End</p>
            </div>

        </div>
    </main>

</body>
</html>
